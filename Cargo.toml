[package]
name = "cancelli"
version = "0.1.0"
edition = "2024"
description = "A Rust port of CARE (arXiv 2607.21642) as a Claude Code PreToolUse hook"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bradvoth/cancelli"
keywords = ["claude-code", "hook", "security", "shell"]
categories = ["command-line-utilities"]

[dependencies]
brush-parser = "0.4.0"
clap = { version = "4.6.7", features = ["derive"] }
fancy-regex = "0.19.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing"] }
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
